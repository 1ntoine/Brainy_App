services:
  gateway:
    build: .
    command: node services/gateway/index.js
    ports: ["4000:4000"]
    env_file: .env
  tasks:
    build: .
    command: node services/tasks/index.js
    ports: ["4001:4001"]
    env_file: .env
  calendar:
    build: .
    command: node services/calendar/index.js
    ports: ["4002:4002"]
    env_file: .env
  notifications:
    build: .
    command: node services/notifications/index.js
    ports: ["4003:4003"]
    env_file: .env
  routine:
    build: .
    command: node services/routine/index.js
    ports: ["4004:4004"]
    env_file: .env
  web:
    build: .
    command: npm run preview --workspace apps/web -- --host 0.0.0.0 --port 5173
    ports: ["5173:5173"]
